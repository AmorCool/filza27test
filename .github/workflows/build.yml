name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (Rust core + Theos dylib + release IPA)
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)/Contents/Developer"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Build Airlift rust core (aarch64-apple-ios)
        run: bash scripts/build_rust_core.sh

      - name: Install Theos
        run: |
          git clone --depth=1 --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Install iOS SDK for Theos
        run: |
          mkdir -p "$HOME/theos/sdks"
          curl -fL -o "$HOME/theos/sdks/iPhoneOS17.5.sdk.zip" \
            https://github.com/xybp888/iOS-SDKs/releases/download/iOS17.5-SDKs/iPhoneOS17.5.sdk.zip
          unzip -q -d "$HOME/theos/sdks" "$HOME/theos/sdks/iPhoneOS17.5.sdk.zip"
          rm -f "$HOME/theos/sdks/iPhoneOS17.5.sdk.zip"
          ls "$HOME/theos/sdks"

      - name: Install host tools (ldid, dpkg-deb)
        run: brew install ldid dpkg || true

      - name: Build tweak dylib
        run: make package FINALPACKAGE=1

      - name: Verify dylib
        run: |
          test -f .theos/obj/FilzaApplySandboxExt.dylib
          lipo -info .theos/obj/FilzaApplySandboxExt.dylib
          ls -lh .theos/obj/FilzaApplySandboxExt.dylib
          echo "--- otool -L ---"
          otool -L .theos/obj/FilzaApplySandboxExt.dylib
          echo "--- end otool ---"
          if otool -L .theos/obj/FilzaApplySandboxExt.dylib | grep -q -i substrate; then
            echo "dylib links CydiaSubstrate; it would crash off-jailbreak" >&2
            exit 1
          fi

      - name: Validate Airlift catalog
        run: plutil -lint Resources/AirliftIndex.json

      - name: Prepare release version
        id: version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=ci-${GITHUB_SHA:0:8}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Filza base IPA
        run: |
          curl -fL --retry 5 --retry-delay 2 -o /tmp/Filza-4.0.0.ipa \
            "https://github.com/Neoncat-OG/TrollStore-IPAs/releases/download/Filza/Filza-4.0.0.ipa"
          echo "5829e97bc5b5dd8a7c3a5f960dd8a2e99aea522b2b9461a6a1b518ec752c8b9d  /tmp/Filza-4.0.0.ipa" | shasum -a 256 -c -
          ls -lh /tmp/Filza-4.0.0.ipa

      - name: Build release IPA (auto-inject dylib)
        run: |
          FILZAAL_VERSION=${{ steps.version.outputs.version }} \
          zsh scripts/build_release_ipa.sh \
            /tmp/Filza-4.0.0.ipa \
            /tmp/FilzaAirlift.ipa \
            Resources/AirliftIndex.json

      - name: Upload dylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: FilzaApplySandboxExt-dylib
          path: .theos/obj/FilzaApplySandboxExt.dylib

      - name: Upload release IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: FilzaAirlift-ipa
          path: /tmp/FilzaAirlift.ipa
          if-no-files-found: error